<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="وجهتي: دليل سياحي تفاعلي لمدن السعودية بخريطة حقيقية ثلاثية الأبعاد">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<title>وجهتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: one app shell — top bar on desktop, bottom tab bar on phones; each screen is a centred column of soft cards */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface2:#EAF1EE; --line:#DCE6E1;
  --ink:#12241F; --muted:#5C6F69; --green:#0E5A4A; --green2:#167A63; --green-soft:#DDEFE8;
  --sand:#C49A5A; --sand-soft:#F5EAD8; --rose:#D0645A;
  --shadow:0 10px 30px rgba(14,90,74,.08);
  --f:"IBM Plex Sans Arabic",Tahoma,sans-serif; --fd:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1715; --surface:#14211E; --surface2:#1A2B27; --line:#263934;
  --ink:#E9F2EF; --muted:#9DB2AB; --green:#5FC7A6; --green2:#7ED6BA; --green-soft:#1B3A32;
  --sand:#E0BC80; --sand-soft:#2E2618; --rose:#EE8A80; --shadow:0 10px 30px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1715; --surface:#14211E; --surface2:#1A2B27; --line:#263934;
  --ink:#E9F2EF; --muted:#9DB2AB; --green:#5FC7A6; --green2:#7ED6BA; --green-soft:#1B3A32;
  --sand:#E0BC80; --sand-soft:#2E2618; --rose:#EE8A80; --shadow:0 10px 30px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.75;direction:rtl;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green2);outline-offset:2px}
.ico{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top-in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--green);font-family:var(--fd);font-size:26px;font-weight:700;line-height:1}
.logo svg{width:30px;height:30px}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14.5px;padding:7px 14px;border-radius:999px}
.nav a[aria-current="page"]{background:var(--green-soft);color:var(--green);font-weight:600}
.nav a:hover{color:var(--green)}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--rose);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 5px;font-weight:700}

/* bottom tab bar (phones) */
.tabs{display:none}
@media (max-width:760px){
  .nav{display:none}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);text-decoration:none;padding:4px 0;position:relative}
  .tabs a .ico{width:22px;height:22px}
  .tabs a[aria-current="page"]{color:var(--green);font-weight:600}
  .tabs .badge{position:absolute;top:0;left:calc(50% - 22px)}
  main{padding-bottom:84px!important}
}

main{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.screen{display:flex;flex-direction:column;gap:26px;animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--fd);font-weight:600;font-size:22px;color:var(--ink)}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.link{color:var(--green);font-weight:600;text-decoration:none;font-size:14.5px;display:inline-flex;align-items:center;gap:4px;background:none;border:0;cursor:pointer;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--green);color:var(--surface)}
.btn.pri:hover{background:var(--green2)}
.btn.sec{background:var(--sand-soft);color:var(--ink)}
.btn.ghost{background:var(--surface);color:var(--green);border:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 15px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--surface);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.tag{font-size:12px;font-weight:600;padding:1px 10px;border-radius:999px;background:var(--green-soft);color:var(--green)}
.tag.s{background:var(--sand-soft);color:var(--sand)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:clamp(22px,5vw,48px);background:#0E5A4A;color:#fff;display:flex;align-items:center;min-height:460px}
.hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to left,rgba(9,52,43,.94) 0%,rgba(9,52,43,.82) 38%,rgba(9,52,43,.25) 62%,rgba(9,52,43,0) 80%)}
.hero-txt{position:relative;z-index:2;max-width:520px}
.hero h1{font-family:var(--fd);font-size:clamp(30px,6vw,46px);line-height:1.35;font-weight:700}
.hero h1 span{color:#F6D69B}
.hero p{margin:6px 0 18px;color:#D7EEE6;max-width:40ch}
.search{position:relative;max-width:460px}
.search input{width:100%;border:0;border-radius:16px;padding:14px 48px 14px 16px;background:#fff;color:#12241F;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.search input::placeholder{color:#7C8E88}
.search .ico{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#0E5A4A;width:22px;height:22px}
.sugg{position:absolute;inset:calc(100% + 6px) 0 auto;background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.18);overflow:hidden;z-index:5}
.sugg button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:10px 14px;text-align:right;cursor:pointer}
.sugg button:hover,.sugg button.on{background:var(--surface2)}
.sugg small{color:var(--muted);margin-inline-start:auto}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hero .btn.pri{background:#F6D69B;color:#12241F}
.hero .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.hero-art{position:absolute;inset:0;z-index:0}
.hero-art svg{display:block;width:100%;height:100%}
.hero-art .cap{position:absolute;z-index:3;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;background:rgba(8,24,20,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:4px 16px;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap;opacity:0;transition:opacity .6s}
.hero-art .cap.on{opacity:1}
.hero-art .cap small{font-weight:400;opacity:.8;margin-inline-start:6px}
.irisScene{transition:opacity .9s ease}
@media (max-width:760px){.hero{min-height:600px;align-items:flex-end;border-radius:24px}.hero::after{background:linear-gradient(to bottom,rgba(9,52,43,0) 22%,rgba(9,52,43,.78) 50%,rgba(9,52,43,.95) 72%)}.hero-art .cap{bottom:auto;top:14px;left:14px}}

/* map */
.mapwrap{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media (max-width:860px){.mapwrap{grid-template-columns:1fr}}
.map{padding:12px;position:relative;min-width:0}
.map>svg{display:block;width:100%;height:auto;direction:ltr}
.land{fill:var(--green-soft);stroke:var(--green);stroke-width:2;stroke-linejoin:round}
.sea-lbl{fill:var(--muted);font-size:20px;font-family:var(--f);opacity:.7}
.pin{cursor:pointer}
.pin .halo{fill:var(--green);opacity:.18;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.pin .dot{fill:var(--green);stroke:var(--surface);stroke-width:4;transition:r .2s}
.pin text{font-family:var(--f);font-size:24px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:6px;stroke-linejoin:round}
.pin:hover .dot,.pin.on .dot{fill:var(--sand)}
.pin.on .halo{fill:var(--sand);opacity:.35}
.pin.dim{opacity:.25}
@media (max-width:600px){.pin text{font-size:40px;stroke-width:9px}.pin .dot{r:15px}.sea-lbl{font-size:28px}}
@keyframes pulse{0%{transform:scale(.6);opacity:.35}100%{transform:scale(1.8);opacity:0}}
.maphint{position:absolute;top:14px;right:16px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.preview{overflow:hidden;display:flex;flex-direction:column}
.preview .art{aspect-ratio:16/9;max-width:100%}
.preview .art svg{display:block;width:100%;height:100%}
.preview .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.preview h3{font-family:var(--fd);font-size:24px;font-weight:600}
.preview p{margin:0;color:var(--muted);font-size:14.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini-places{display:flex;flex-direction:column;gap:6px;margin:4px 0 6px;padding:0;list-style:none}
.mini-places li{display:flex;align-items:center;gap:8px;font-size:14px}
.mini-places li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sand);flex:none}

/* months */
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
@media (max-width:700px){.months{grid-template-columns:repeat(6,1fr)}}
.month{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
.month[aria-pressed="true"]{background:var(--sand);border-color:var(--sand);color:#fff;font-weight:700}
.month-res{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.mres{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500;font-size:14.5px}
.mres i{width:30px;height:30px;border-radius:50%;overflow:hidden;display:block}
.mres i svg{width:100%;height:100%;display:block}

/* city cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ccard{display:flex;flex-direction:column;text-decoration:none;color:inherit;overflow:hidden;transition:transform .2s,box-shadow .2s}
.ccard:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(14,90,74,.14)}
.ccard .art{aspect-ratio:16/10;position:relative;max-width:100%}
.ccard .art svg{display:block;width:100%;height:100%}
.ccard .reg{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.88);color:#12241F;font-size:12px;font-weight:600;padding:1px 10px;border-radius:999px}
.ccard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.ccard h3{font-family:var(--fd);font-size:21px;font-weight:600}
.ccard p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;font-size:13px;color:var(--muted)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.listbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.listbar .search{flex:1;min-width:220px;max-width:none}
.listbar .search input{box-shadow:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding-block:11px}

/* details */
.back{align-self:flex-start}
.banner{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:21/8;min-height:220px;max-width:100%}
.banner svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.banner .over{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 60%);display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(16px,4vw,30px);color:#fff;gap:6px}
.banner h1{font-family:var(--fd);font-size:clamp(34px,7vw,54px);font-weight:700;line-height:1.2}
.banner .row .tag{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(4px)}
.dgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
@media (max-width:860px){.dgrid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.pad{padding:18px 20px}
.pad h2{font-size:19px;margin-bottom:8px}
.pad p{margin:0}
.yearbar{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px}
.yearbar span{height:36px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.yearbar span.good{background:var(--green);color:var(--surface);font-weight:700}
.yearbar span.now{outline:2px solid var(--sand);outline-offset:1px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--green);margin-inline-end:5px;vertical-align:middle}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.place{padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative}
.place h3{font-size:16.5px;font-weight:700;padding-inline-end:36px}
.place p{margin:0;color:var(--muted);font-size:14px}
.place .when{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.heart{position:absolute;top:10px;left:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:transform .15s}
.heart:active{transform:scale(.85)}
.heart[aria-pressed="true"]{color:var(--rose);border-color:var(--rose);background:color-mix(in srgb,var(--rose) 10%,var(--surface))}
.heart[aria-pressed="true"] .ico{fill:currentColor}
.fact{background:var(--sand-soft);border-color:transparent}
.fact h2{color:var(--sand)}
.side-cta{display:flex;flex-direction:column;gap:10px}
.mine{font-size:12px;color:var(--sand);font-weight:600}

/* planner */
.planner{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media (max-width:860px){.planner{grid-template-columns:1fr}}
.form{padding:18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field select,.field input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink);width:100%}
.days{display:flex;gap:6px}
.days button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;cursor:pointer;font-weight:600}
.days button[aria-pressed="true"]{background:var(--green);color:var(--surface);border-color:var(--green)}
.day{padding:16px 18px}
.day-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.day-h b{width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--surface);display:grid;place-items:center;font-family:var(--fd);font-size:16px}
.day-h h3{font-family:var(--fd);font-size:19px;font-weight:600}
.slot{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.slot:first-of-type{border-top:0}
.slot .t{font-size:13px;color:var(--sand);font-weight:700}
.slot .n{font-weight:600}
.slot .n small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.x{border:0;background:var(--surface2);width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.plan-list{display:flex;flex-direction:column;gap:12px}

/* favourites + admin */
.fav{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.fav i{width:56px;height:56px;border-radius:14px;overflow:hidden;display:block}
.fav i svg{width:100%;height:100%;display:block}
.fav b{display:block}
.fav small{color:var(--muted)}
.favs{display:flex;flex-direction:column;gap:10px}
.admin{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:860px){.admin{grid-template-columns:1fr}}
.note{font-size:13px;color:var(--muted);margin:0}

/* quiz modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(6,20,16,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-left,0px))}
.dialog{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 60px rgba(0,0,0,.3);animation:pop .25s ease}
@keyframes pop{from{transform:scale(.95);opacity:.5}to{transform:none;opacity:1}}
.dialog .steps{display:flex;gap:6px}
.dialog .steps i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}
.dialog .steps i.on{background:var(--green)}
.dialog h2{font-size:21px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}
.opt:hover{border-color:var(--green)}
.opt .ico{width:28px;height:28px;color:var(--green)}
.result{display:flex;flex-direction:column;gap:12px}
.result .art{border-radius:18px;overflow:hidden;aspect-ratio:16/8;max-width:100%}
.result .art svg{width:100%;height:100%;display:block}
.toast{position:fixed;z-index:50;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .2s ease}
@media (min-width:761px){.toast{bottom:28px}}
/* visitors' experiences */
.comm{display:flex;flex-direction:column;gap:14px}
.comm-sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score{font-family:var(--fd);font-size:34px;font-weight:700;color:var(--green);line-height:1}
.stars{color:var(--sand);letter-spacing:2px;font-size:18px}
.compose{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.compose textarea{width:100%;min-height:86px;resize:vertical;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.mood b{color:var(--sand);letter-spacing:1px}
.mood[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.kinds{display:flex;gap:6px}
.photo-pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photo-pick label{cursor:pointer}
.photo-pick input{position:absolute;opacity:0;width:1px;height:1px}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gallery button{padding:0;border:0;border-radius:14px;overflow:hidden;aspect-ratio:1;cursor:pointer;background:var(--surface2)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.post{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.post-h{display:flex;align-items:center;gap:10px}
.post-h img{width:34px;height:34px;border-radius:50%;flex:none}
.post-h b{font-size:14.5px;display:block;line-height:1.3}
.post-h small{color:var(--muted);font-size:12.5px}
.post-h .stars{font-size:14px;margin-inline-start:auto}
.post p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.post .pimg{border-radius:14px;max-height:320px;min-height:160px;width:100%;object-fit:cover;cursor:pointer;background:var(--surface2)}
img[data-pic]:not([src]){visibility:hidden}
.post .tag.tip{background:var(--sand-soft);color:var(--sand)}
.post .del{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0}
.post .del:hover{color:var(--rose)}
.imgfail{display:grid;place-items:center;height:120px;border-radius:14px;background:var(--surface2);color:var(--muted);font-size:13px}
.state{font-size:13.5px;color:var(--muted)}
.lb{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:88vh;border-radius:14px}
.rate-chip{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--sand)}
footer{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px));color:var(--muted);font-size:13px;text-align:center}
@media (max-width:760px){footer{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.gmapc{padding:0;overflow:hidden;position:relative;min-height:440px;min-width:0}
.gmapc #gmap,.dmapc #dmap{position:absolute;inset:0}
.dmapc{padding:0;overflow:hidden;position:relative;height:400px}
.gmapc:fullscreen,.dmapc:fullscreen{border-radius:0}

.cm span{background:#fff;color:#12241F;font-weight:700;font-size:13px;line-height:1.5;padding:2px 11px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.22);white-space:nowrap}
.cm i{width:16px;height:16px;border-radius:50%;background:#0E5A4A;border:3px solid #fff;box-shadow:0 0 0 6px rgba(14,90,74,.22),0 2px 6px rgba(0,0,0,.3)}
.cm.on span{background:#0E5A4A;color:#fff}.cm.on i{background:#C49A5A;box-shadow:0 0 0 8px rgba(196,154,90,.3)}
.msearch{position:absolute;z-index:3;top:10px;right:10px;width:min(340px,calc(100% - 64px))}
.msearch .in{display:flex;align-items:center;gap:8px;background:#fff;color:#12241F;border-radius:999px;padding:0 14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.msearch input{flex:1;min-width:0;border:0;background:none;outline:none;padding:10px 0;font-size:14.5px;color:#12241F}
.msugg{margin-top:6px;background:var(--surface);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-height:300px;overflow:auto;padding:6px}
.msugg button{display:grid;grid-template-columns:auto 1fr;column-gap:8px;width:100%;text-align:start;background:none;border:0;border-radius:10px;padding:8px 10px;cursor:pointer}
.msugg button:hover{background:var(--surface2)}
.msugg button .ico{grid-row:span 2;color:var(--green);margin-top:3px}
.msugg small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msugg .state{margin:6px 10px;font-size:13px}
.mreset{position:absolute;z-index:2;bottom:38px;left:10px;background:#fff;color:#12241F;border:0;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.modes button{width:auto!important;padding:0 11px!important;font:600 12.5px var(--f)!important;color:#12241F}
.modes button[aria-pressed="true"]{background:#0E5A4A!important;color:#fff}
.maplibregl-ctrl-attrib{font-family:var(--f);direction:ltr}
.mpop{font-family:var(--f);direction:rtl;color:#12241F;font-size:14px}
.mpop b{display:block;margin-bottom:6px}.mpop div{display:flex;gap:10px;flex-wrap:wrap}.mpop a{color:#0E5A4A;font-weight:600}
.dmap-h{position:absolute;z-index:2;top:10px;right:10px;background:rgba(255,255,255,.94);color:#12241F;border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.gl{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--green);text-decoration:none;background:none;border:0;padding:0 6px;cursor:pointer}
.gl .ico{width:1em;height:1em}
.place .when{flex-wrap:wrap;align-items:center}

function scene(c,w=400,h=220){

      { let x=w*.08; const hs=[.34,.46,.3,.52,.38,.6,.28,.42,.36];
        hs.forEach((v,i)=>{const bw=w*.075, bh=h*v; b+=`<rect x="${x}" y="${h*.86-bh}" width="${bw}" height="${bh}" rx="3" fill="${g2}" opacity="${.75+i%3*.08}"/>`; x+=bw+w*.012; }); }
      b += `<path d="M${w*.47} ${h*.86} L${w*.49} ${h*.16} Q${w*.52} ${h*.08} ${w*.55} ${h*.16} L${w*.57} ${h*.86}z" fill="${c.pal[4]}"/><path d="M${w*.505} ${h*.22} Q${w*.52} ${h*.15} ${w*.535} ${h*.22} V${h*.3} H${w*.505}z" fill="${s1}"/>`;

      b = sun(w*.22,h*.3,30)+cloud(w*.7,h*.22,1)+cloud(w*.4,h*.14,.7,.7);
      b += `<path d="M${w*.74} ${h*.62} Q${w*.745} ${h*.1} ${w*.75} ${h*.08} Q${w*.755} ${h*.1} ${w*.76} ${h*.62}z" fill="#fff" opacity=".85"/><ellipse cx="${w*.75}" cy="${h*.1}" rx="14" ry="8" fill="#fff" opacity=".7"/>`;
      b += `<rect y="${h*.58}" width="${w}" height="${h*.42}" fill="${g1}"/>`;
      for(let i=0;i<4;i++) b+=`<path d="M0 ${h*(.64+i*.08)} q${w/16} -8 ${w/8} 0 t${w/8} 0 t${w/8} 0 t${w/8} 0 t${w/8} 0 t${w/8} 0 t${w/8} 0 t${w/8} 0" fill="none" stroke="#fff" stroke-width="2" opacity="${.5-i*.08}"/>`;

function startEye(){
  const svg=document.getElementById('eyeSvg'); if(!svg) return;
  const zoom=svg.querySelector('#eyeZoom'), lid=svg.querySelector('#eLid'), cap=document.getElementById('eyeCap');
  const scenes=[...svg.querySelectorAll('.irisScene')];
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const {x,y}=EYE; let S=EYE.S, tx=200, ty=150, s0=1;
  const frameFit=()=>{ const b=svg.getBoundingClientRect(); const ar=b.width/Math.max(1,b.height);
    let vw=400,vh=300; if(ar>4/3) vh=400/ar; else vw=300*ar;
    if(ar>=1){ S=Math.min(vh*.86,vw*.5)/(2*EYE.r); tx=200-vw*.27; ty=150; s0=Math.max(1,vh/170); }
    else { S=(vw*.8)/(2*EYE.r); tx=200; ty=150-vh*.2; s0=1.1; } };
  frameFit();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const setZ=e=>{ const s=s0+(S-s0)*e, sx=tx, sy=ty; zoom.setAttribute('transform',`translate(${(sx-s*x).toFixed(2)} ${(sy-s*y).toFixed(2)}) scale(${s.toFixed(4)})`); };
  const setLid=k=>lid.setAttribute('transform',`translate(0 100) scale(1 ${k.toFixed(3)}) translate(0 -100)`);
  let idx=0;
  const show=i=>{ scenes.forEach((g,j)=>g.setAttribute('opacity',j===i?'1':'0')); const c=byId[EYE_CITIES[i]]; cap.href='#'+c.id; cap.innerHTML=`${c.name}<small>${c.region}</small>`; };
  show(0);
  const t0=performance.now(), HOLD=900, ZOOM=3200;
  let lastSwitch=0, nextBlink=HOLD+ZOOM+2600, zoomed=false;
  if(calm){ setZ(1); cap.classList.add('on'); }
  function frame(now){
    if(!svg.isConnected) return;
    const t=now-t0;
    if(!calm && !zoomed){
      const p=Math.min(1,Math.max(0,(t-HOLD)/ZOOM)); setZ(ease(p));
      if(p>=1){ zoomed=true; lastSwitch=t; cap.classList.add('on'); }
    }
    const every=calm?4000:2600;
    if((zoomed||calm) && t-lastSwitch>every){ lastSwitch=t; idx=(idx+1)%scenes.length;
      if(!calm){ nextBlink=t; } show(idx); }
    if(!calm && zoomed && t>=nextBlink){ const b=(t-nextBlink)/220; if(b>=1){ setLid(0); nextBlink=t+99999; } else setLid(Math.sin(b*Math.PI)); }
    requestAnimationFrame(frame);
  }
  setZ(calm?1:0); requestAnimationFrame(frame);
  addEventListener('resize',()=>{ if(!svg.isConnected) return; frameFit(); if(zoomed||calm) setZ(1); });
}

/* planner */
function buildPlan(cid,days){
  const c=byId[cid]; const ps=placesOf(c);
  const pool={صباح:ps.filter(p=>p.t==='صباح'),عصر:ps.filter(p=>p.t==='عصر'),مساء:ps.filter(p=>p.t==='مساء')};
  const all=ps.slice(); let k=0; const used=new Set(); const out=[];
  for(let d=0; d<days; d++){
    const day=[];
    for(const t of ['صباح','عصر','مساء']){
      let p=pool[t].find(x=>!used.has(x.n)) || all.find(x=>!used.has(x.n));
      if(!p){ p={n:'وقت حر واستكشاف',d:'تجول في المدينة على راحتك.',t}; } else used.add(p.n);
      day.push({n:p.n,d:p.d,t});
    }
    if(d===0) day.splice(2,0,{n:'تجربة أكل شعبي',d:c.food,t:'غداء'});
    out.push(day);
  }
  return {city:cid,days,items:out};
}

const QZ=[

  {q:'مع مين بتسافر؟',k:'who',o:[['العائلة','fam','family'],['الأصدقاء','fr','users'],['لحالي','me','user'],['أي أحد','any','spark']]}

function quiz(){
  const ans={}; let step=0;
  const L=$('#layer');
  const close=()=>{L.innerHTML='';document.removeEventListener('keydown',onKey)};
  const onKey=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',onKey);
  function draw(){
    let inner;
    if(step<QZ.length){
      const s=QZ[step];
      inner=`<div class="steps">${QZ.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><h2>${s.q}</h2><div class="opts">${s.o.map(o=>`<button class="opt" data-v="${o[1]}">${ic(o[2])}${o[0]}</button>`).join('')}</div>`;
    } else {
      const months={w:[12,1,2],s:[6,7,8],sp:[3,4,5],now:[nowM]}[ans.season];
      const sc=CITIES.map(c=>({c,s:(c.tags.includes(ans.tag)?3:0)+(c.months.some(m=>months.includes(m))?2:0)+(ans.who==='fam'&&c.tags.includes('مدينة')?.5:0)})).sort((a,b)=>b.s-a.s);
      const best=sc[0].c, alt=sc.slice(1,3).map(x=>x.c);
      inner=`<div class="result"><span class="tag s" style="align-self:flex-start">نقترح لك</span><div class="art">${scene(best,500,250)}</div><h2 style="font-size:28px">${best.name}</h2><p style="margin:0;color:var(--muted)">${best.about}</p><p class="note">أفضل وقت: ${monthsTxt(best)}</p>
      <div class="row"><a class="btn pri" href="#${best.id}" data-close>شوف التفاصيل</a><button class="btn sec" data-plan="${best.id}" data-close>${ic('route')} خطط رحلة</button></div>
      <p class="note">خيارات ثانية: ${alt.map(c=>`<a class="link" href="#${c.id}" data-close>${c.name}</a>`).join(' · ')}</p></div>`;
    }
    L.innerHTML=`<div class="modal" data-bg><div class="dialog" role="dialog" aria-modal="true" aria-label="وش يناسبني"><div class="row" style="justify-content:space-between"><strong>${ic('spark')} وش يناسبني؟</strong><button class="x" data-close aria-label="إغلاق">${ic('x')}</button></div>${inner}</div></div>`;
    const first=L.querySelector('.opt,.btn'); if(first) first.focus();
  }
  L.onclick=e=>{
    if(e.target.matches('[data-bg]')||e.target.closest('[data-close]')){ if(!e.target.closest('[data-plan]')) {close();} else close(); return; }
    const o=e.target.closest('.opt'); if(o){ ans[QZ[step].k]=o.dataset.v; step++; draw(); }
  };
  draw();
}

}
function makeMap(el,o){
  const map=new maplibregl.Map({container:el,style:'https://tiles.openfreemap.org/styles/liberty',center:o.center,zoom:o.zoom,bounds:o.bounds,fitBoundsOptions:{padding:28},pitch:o.pitch??55,bearing:o.bearing||0,maxPitch:78,cooperativeGestures:true,attributionControl:{compact:true},locale:ML_LOCALE});
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-left');
  map.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true}}),'top-left');
  map.addControl(new maplibregl.FullscreenControl({container:o.wrap||el.parentElement}),'top-left');
  map.addControl(new ModeCtl(),'bottom-right');
  map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-left');
  map.on('load',()=>styleMap(map));
  map.on('error',e=>console.warn('map:',e&&e.error&&e.error.message));
  MAPS.push(map); return map;
}
function cityMarker(map,c,onPick){
  const el=document.createElement('button'); el.type='button'; el.className='cm'+(c.id===selCity?' on':''); el.dataset.c=c.id; el.setAttribute('aria-label',c.name);
  el.innerHTML=`<span>${c.name}</span><i></i>`;
  if(onPick) el.addEventListener('click',ev=>{ev.stopPropagation();onPick(c.id);}); else el.tabIndex=-1;
  new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat(LL[c.id]).addTo(map); return el;
}
const flyCity=(map,c)=>map.flyTo({center:LL[c.id],zoom:c.kind==='city'?14.6:12.2,pitch:62,bearing:-25,duration:3600,essential:true});
function pickCity(id){
  selCity=id; document.querySelectorAll('.cm').forEach(b=>b.classList.toggle('on',b.dataset.c===id));
  const pv=$('#pv'); if(pv) pv.innerHTML=previewHTML(byId[id]);
  if(MV.home) flyCity(MV.home,byId[id]);
}
function dropPin(map,lon,lat,name){
  if(MV.pin) MV.pin.remove();
  const pop=new maplibregl.Popup({offset:28,closeButton:true,maxWidth:'260px'}).setDOMContent((()=>{const d=document.createElement('div');d.className='mpop';d.innerHTML=`<b></b><div><a target="_blank" rel="noopener" href="${gmq(lat+','+lon)}">افتح في قوقل ماب</a><a target="_blank" rel="noopener" href="${gmdir(lon,lat)}">الاتجاهات</a></div>`;d.querySelector('b').textContent=name;return d;})());
  MV.pin=new maplibregl.Marker({color:'#D0645A'}).setLngLat([lon,lat]).setPopup(pop).addTo(map); MV.pin.togglePopup();
  map.flyTo({center:[lon,lat],zoom:16.2,pitch:62,bearing:map.getBearing()||-20,duration:3000,essential:true});
}
const GEO=store.get('geo',{});
async function geocode(q,near,limit=1){
  const key=q+'|'+(near?near.join(','):'')+'|'+limit; if(GEO[key]) return GEO[key];
  let u='https://nominatim.openstreetmap.org/search?format=jsonv2&accept-language=ar&countrycodes=sa&limit='+limit+'&q='+encodeURIComponent(q);
  if(near) u+=`&viewbox=${near[0]-.9},${near[1]+.9},${near[0]+.9},${near[1]-.9}&bounded=1`;
  const r=await fetch(u,{headers:{'Accept':'application/json'}}); if(!r.ok) throw new Error('geo');
  const j=(await r.json()).map(x=>({lon:+x.lon,lat:+x.lat,n:x.name||x.display_name.split('،')[0].split(',')[0],d:x.display_name}));
  if(j.length){ GEO[key]=j; store.set('geo',GEO); } return j;
}
async function geoPlace(cid,idx){
  const c=byId[cid], p=placesOf(c)[idx]; if(!p||!MV.detail) return;
  const box=$('#dmapc'); if(box) box.scrollIntoView({behavior:'smooth',block:'center'});
  toast('نبحث عن «'+p.n+'» في الخريطة…');
  try{
    let r=await geocode(p.n,LL[cid]); if(!r.length) r=await geocode(p.n+' '+c.name);
    if(!r.length){ toast('ما لقيناه بالخريطة، افتحه في قوقل ماب'); return; }
    dropPin(MV.detail,r[0].lon,r[0].lat,p.n);
  }catch(_){ toast('ما قدرنا نبحث الحين، جرّب بعد شوي'); }
}
let msT=0;
function mapSearch(q){
  const box=$('#msugg'); if(!box) return; clearTimeout(msT); q=q.trim();
  if(!q){ box.hidden=true; return; }
  const loc=[]; CITIES.forEach(c=>{ if(c.name.includes(q)) loc.push(`<button type="button" data-mc="${c.id}">${ic('pin')}<span>${c.name}</span><small>${c.region}</small></button>`); });
  box.innerHTML=loc.join('')+`<p class="state">نبحث في الخريطة…</p>`; box.hidden=false;
  msT=setTimeout(async()=>{
    try{ const r=await geocode(q,null,6); if($('#mq')?.value.trim()!==q) return;
      box.innerHTML=loc.join('')+(r.length?r.map(x=>`<button type="button" data-ll="${x.lon},${x.lat}" data-n="${esc(x.n)}">${ic('pin')}<span>${esc(x.n)}</span><small>${esc(x.d)}</small></button>`).join(''):(loc.length?'':`<p class="state">ما فيه نتائج</p>`));
    }catch(_){ box.innerHTML=loc.join('')+`<p class="state">البحث غير متاح الحين</p>`; }
  },550);
}
function initMaps(){
  if(!GL) return;
  const h=$('#gmap');
  if(h){ try{
    MV.home=makeMap(h,{bounds:KSA,pitch:45,bearing:0,wrap:$('#gmapc')});
    CITIES.forEach(c=>cityMarker(MV.home,c,pickCity));
  }catch(e){ console.warn(e); } }
  const d=$('#dmap');
  if(d){ try{ const c=byId[d.dataset.city];
    MV.detail=makeMap(d,{center:LL[c.id],zoom:c.kind==='city'?13.4:11.4,pitch:60,bearing:-25,wrap:$('#dmapc')});
    cityMarker(MV.detail,c,null);
  }catch(e){ console.warn(e); } }
}
function killMaps(){ MAPS.forEach(m=>{try{m.remove();}catch(_){}}); MAPS=[]; MV.home=MV.detail=MV.pin=null; }
function localDB(){
  const K='wj_localdb'; let data; try{data=JSON.parse(localStorage.getItem(K))||{};}catch(_){data={};}
  const subs=[]; const save=()=>{ try{localStorage.setItem(K,JSON.stringify(data));}catch(_){ throw {code:'quota_exceeded'}; } };
  const snap=()=>({metadata:{fromCache:false},docs:Object.keys(data).filter(k=>/^posts\/[^/]+$/.test(k)).map(k=>({id:k.split('/')[1],data:()=>data[k]}))});
  const emit=()=>subs.forEach(f=>f(snap()));
  return {
    doc:p=>({ get:async()=>({exists:p in data,data:()=>data[p]}),
      set:async v=>{ const had=p in data, old=data[p]; data[p]=v; try{save();}catch(e){ if(had) data[p]=old; else delete data[p]; throw e; } emit(); },
      delete:async()=>{ delete data[p]; save(); emit(); } }),
    collection:()=>({ limit(){return this;}, onSnapshot(f){ subs.push(f); setTimeout(()=>f(snap())); return ()=>{}; } })
  };
}

/* ---------- router & events ---------- */
function render(){
  killMaps(); const r=current(); const V=$('#view');
  if(byId[r]){ selCity=r; V.innerHTML=details(byId[r]); document.title=byId[r].name+' · وجهتي'; }
  else if(r==='cities'){ V.innerHTML=cities(); document.title='المدن · وجهتي'; }
  else if(r==='plan'){ V.innerHTML=planScreen(); document.title='رحلتي · وجهتي'; }
  else if(r==='fav'){ V.innerHTML=favScreen(); document.title='المفضلة · وجهتي'; }
  else if(r==='admin'){ V.innerHTML=adminScreen(); document.title='الإدارة · وجهتي'; }
  else { V.innerHTML=home(); document.title='وجهتي'; }
  drawNav(); window.scrollTo(0,0); startEye(); initMaps();
}
let planDays=null;
document.addEventListener('click',e=>{
  const t=e.target;
  const pin=t.closest('.pin');
  if(pin){ selCity=pin.dataset.c; document.querySelectorAll('.pin').forEach(p=>p.classList.toggle('on',p===pin)); $('#pv').innerHTML=previewHTML(byId[selCity]); if(innerWidth<860) $('#pv').scrollIntoView({behavior:'smooth',block:'nearest'}); return; }
  const m=t.closest('.month'); if(m){ selMonth=+m.dataset.m; document.querySelectorAll('.month').forEach(x=>x.setAttribute('aria-pressed',String(x===m))); $('#mres').innerHTML=monthRes(); return; }
  const ch=t.closest('#types .chip'); if(ch){ fType=ch.dataset.t; document.querySelectorAll('#types .chip').forEach(x=>x.setAttribute('aria-pressed',String(x===ch))); $('#clist').innerHTML=cityList(); return; }
  const fv=t.closest('[data-fav]'); if(fv){ const [cid,...n]=fv.dataset.fav.split('|'); toggleFav(cid,n.join('|'),fv); if(current()==='fav') render(); return; }
  if(t.closest('[data-quiz]')){ quiz(); return; }
  const pl=t.closest('[data-plan]'); if(pl){ plan=buildPlan(pl.dataset.plan, plan&&plan.city===pl.dataset.plan?plan.days:2); store.set('plan',plan); if(location.hash==='#plan') render(); else location.hash='plan'; return; }
  const pd=t.closest('#pdays button'); if(pd){ planDays=+pd.dataset.d; document.querySelectorAll('#pdays button').forEach(x=>x.setAttribute('aria-pressed',String(x===pd))); return; }
  const rm=t.closest('[data-rm]'); if(rm){ const [d,s]=rm.dataset.rm.split('-').map(Number); plan.items[d].splice(s,1); store.set('plan',plan); $('#plist').innerHTML=planList(); toast('انحذف النشاط'); return; }
  if(t.closest('#pclear')){ plan=null; store.set('plan',null); render(); return; }
  const dl=t.closest('[data-del]'); if(dl){ const [cid,i]=dl.dataset.del.split('-'); extra[cid].splice(+i,1); if(!extra[cid].length) delete extra[cid]; store.set('extra',extra); render(); toast('انحذف المكان'); return; }
  const gg=t.closest('[data-geo]'); if(gg){ const [cid,i]=gg.dataset.geo.split('|'); geoPlace(cid,+i); return; }
  const mc=t.closest('[data-mc]'); if(mc){ $('#msugg').hidden=true; pickCity(mc.dataset.mc); return; }
  const mll=t.closest('[data-ll]'); if(mll){ $('#msugg').hidden=true; const [lo,la]=mll.dataset.ll.split(',').map(Number); if(MV.home) dropPin(MV.home,lo,la,mll.dataset.n); return; }
  if(t.closest('#mreset')){ if(MV.home){ if(MV.pin){MV.pin.remove();MV.pin=null;} MV.home.fitBounds(KSA,{padding:28,pitch:45,bearing:0,duration:2500}); } return; }
  if(!t.closest('#ms')){ const s=$('#msugg'); if(s) s.hidden=true; }
  const sg=t.closest('#hsugg button'); if(sg){ location.hash=sg.dataset.c; return; }
  const kd=t.closest('[data-kind]'); if(kd){ draft.kind=kd.dataset.kind; refreshComm(); return; }
  const rt=t.closest('[data-rate]'); if(rt){ draft.rating=+rt.dataset.rate; document.querySelectorAll('[data-rate]').forEach(x=>x.setAttribute('aria-pressed',String(x===rt))); return; }
  if(t.closest('#cphotoX')){ if(draft.preview) URL.revokeObjectURL(draft.preview); draft.file=null; draft.preview=null; refreshComm(); return; }
  const lb=t.closest('[data-lb]'); if(lb){ const v=PICS[lb.dataset.lb]; if(typeof v!=='string') return; const L=$('#layer'); L.innerHTML='<div class="lb"><img alt="صورة من زائر"></div>'; L.querySelector('img').src=v; L.onclick=()=>{L.innerHTML='';}; return; }
  const dp=t.closest('[data-delpost]'); if(dp){ const [u,i]=dp.dataset.delpost.split('|'); if(dp.dataset.sure){ deletePost(u,i); } else { dp.dataset.sure='1'; dp.textContent='متأكد؟ اضغط مرة ثانية للحذف'; setTimeout(()=>{ if(dp.isConnected){ delete dp.dataset.sure; dp.textContent='حذف'; } },4000); } return; }
  if(!t.closest('#hs')) { const s=$('#hsugg'); if(s) s.hidden=true; }
});
document.addEventListener('keydown',e=>{ const pin=e.target.closest&&e.target.closest('.pin'); if(pin&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pin.dispatchEvent(new MouseEvent('click',{bubbles:true}));} });
document.addEventListener('change',e=>{
  if(e.target.id==='cphoto'){ const f=e.target.files&&e.target.files[0]; if(!f) return; if(!/^image\//.test(f.type)){toast('اختر صورة');return;} if(draft.preview) URL.revokeObjectURL(draft.preview); draft.file=f; draft.preview=URL.createObjectURL(f); const t=$('#ctext'); const v=t?t.value:''; refreshComm(); const t2=$('#ctext'); if(t2) t2.value=v; }
});
document.addEventListener('input',e=>{
  if(e.target.id==='mq'){ mapSearch(e.target.value); }
  if(e.target.id==='lq'){ fQ=e.target.value; $('#clist').innerHTML=cityList(); }
  if(e.target.id==='hq'){
    const q=e.target.value.trim(), box=$('#hsugg');
    if(!q){box.hidden=true;return;}
    const res=[]; CITIES.forEach(c=>{ if(c.name.includes(q)||c.region.includes(q)) res.push([c,c.name,c.region]); placesOf(c).forEach(p=>{ if(p.n.includes(q)) res.push([c,p.n,c.name]); }); });
    box.innerHTML=res.length?res.slice(0,6).map(([c,a,b])=>`<button data-c="${c.id}">${ic('pin')}<span>${esc(a)}</span><small>${esc(b)}</small></button>`).join(''):`<button disabled><span>ما فيه نتائج</span></button>`;
    box.hidden=false;
  }
});
document.addEventListener('keydown',e=>{ if(e.target.id==='mq'&&e.key==='Enter'){ e.preventDefault(); const b=$('#msugg button'); if(b) b.click(); return; } if(e.target.id==='hq'&&e.key==='Enter'){ const b=$('#hsugg button[data-c]'); if(b) location.hash=b.dataset.c; } });
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='cform'){ if(!draft.busy) submitPost($('#comm').dataset.city); return; }
  if(e.target.id==='pform'){ const cid=$('#pcity').value; const d=planDays||(plan?plan.days:2); plan=buildPlan(cid,d); planDays=null; store.set('plan',plan); render(); toast('رتّبنا رحلتك ✓'); }
  if(e.target.id==='aform'){ const cid=$('#acity').value; const n=$('#aname').value.trim(), d=$('#adesc').value.trim(); if(!n||!d) return;
    (extra[cid]=extra[cid]||[]).push({n,d,t:$('#atime').value}); store.set('extra',extra); render(); toast('انضاف المكان إلى '+byId[cid].name); }
});
addEventListener('hashchange',render);
render();
initLive();
</script>
